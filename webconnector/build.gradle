plugins { id 'com.android.application' }
apply from: rootProject.file('signing.gradle')

android {
    namespace 'local.ttlab.web'
    compileSdk 36
    defaultConfig {
        applicationId 'local.ttlab.web'
        minSdk 31
        targetSdk 36
        versionCode 6
        versionName '1.5'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug {
            buildConfigField 'boolean', 'WEB_FIXTURE', project.hasProperty('webFixture') ? 'true' : 'false'
        }
    }
    if (project.hasProperty('webFixture')) sourceSets.debug.assets.srcDir(rootProject.file('.qa/web-fixture'))
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
// The connector uses Java and Android APIs, so it does not need AGP's implicit Kotlin runtime.
configurations.configureEach { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib' }
dependencies { testImplementation 'junit:junit:4.13.2' }
