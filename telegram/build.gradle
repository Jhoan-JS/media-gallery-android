plugins { id 'com.android.application' }
apply from: rootProject.file('signing.gradle')
def connectorId = (project.findProperty('qaTelegramApplicationId') ?: 'local.ttlab.telegram').toString()
android {
    namespace 'local.ttlab.telegram'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId connectorId
        minSdk 31
        targetSdk 36
        versionCode 2
        versionName '1.1'
        manifestPlaceholders = [connectorAuthority: (project.findProperty('qaTelegramAuthority') ?: connectorId+'.bridge'), connectorLabel: project.hasProperty('qaTelegramApplicationId') ? 'Conector TG · Verificación' : 'Conector TG', galleryPackage: (project.findProperty('qaApplicationId') ?: 'local.ttlab.gallery')]
        buildConfigField 'String', 'GALLERY_PACKAGE', '"'+(project.findProperty('qaApplicationId') ?: 'local.ttlab.gallery')+'"'
        ndk { abiFilters (project.findProperty('uiQaAbi') ?: 'arm64-v8a').toString() }
        testInstrumentationRunner 'local.ttlab.telegram.ConnectorChecks'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}
dependencies {
    implementation files('engine/dist/tgengine.aar')
    implementation 'net.zetetic:sqlcipher-android:4.19.1@aar'
    implementation 'androidx.sqlite:sqlite:2.2.0'
    testImplementation 'junit:junit:4.13.2'
}
