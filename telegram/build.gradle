plugins { id 'com.android.application' }
apply from: rootProject.file('signing.gradle')
def connectorId = (project.findProperty('qaTelegramApplicationId') ?: 'local.ttlab.telegram').toString()
def galleryId = (project.findProperty('qaApplicationId') ?: 'local.ttlab.gallery').toString()
def webSources = rootProject.file('webconnector/src')
def isolatedWorker = project.hasProperty('isolatedWorker')
def workerJava = layout.buildDirectory.dir('generated/sources/isolatedWorker')
def fixtureAssets = layout.buildDirectory.dir('generated/assets/syntheticWebFixture').get().asFile
android {
    namespace 'local.ttlab.telegram'
    compileSdk 36
    buildFeatures { buildConfig true; aidl isolatedWorker }
    defaultConfig {
        applicationId connectorId
        minSdk 31
        targetSdk 36
        versionCode 4
        versionName '2.0'
        manifestPlaceholders = [connectorAuthority: (project.findProperty('qaTelegramAuthority') ?: connectorId+'.bridge'), webAuthority: connectorId+'.web.bridge', connectorLabel: project.hasProperty('qaTelegramApplicationId') ? 'Conector de fuentes · Verificación' : 'Conector de fuentes', galleryPackage: galleryId]
        buildConfigField 'String', 'GALLERY_PACKAGE', '"'+galleryId+'"'
        buildConfigField 'boolean', 'WEB_FIXTURE', 'false'
        ndk { abiFilters (project.findProperty('uiQaAbi') ?: 'arm64-v8a').toString() }
        testInstrumentationRunner 'local.ttlab.telegram.ConnectorChecks'
    }
    buildTypes {
        debug { buildConfigField 'boolean', 'WEB_FIXTURE', project.hasProperty('webFixture') ? 'true' : 'false' }
        release { minifyEnabled false }
    }
    sourceSets {
        main.java.srcDir new File(webSources, 'main/java')
        main.java.srcDir 'src/standalone/java'
        if (isolatedWorker) {
            main.java.setSrcDirs(['src/isolated/java', rootProject.file('isolated/java'), workerJava])
            main.aidl.srcDir rootProject.file('isolated/aidl')
            main.manifest.srcFile 'src/isolated/AndroidManifest.xml'
        }
        if (!isolatedWorker) {
            debug.java.srcDir new File(webSources, 'debug/java')
            if (project.hasProperty('webFixture')) debug.assets.srcDir fixtureAssets
            release.java.srcDir new File(webSources, 'release/java')
        }
        test.java.srcDir new File(webSources, 'test/java')
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}
if (isolatedWorker) {
    configurations.configureEach {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
    }
    def stageWorkerJava = tasks.register('stageWorkerJava', Sync) {
        from('src/main/java') { include 'local/ttlab/telegram/BridgePolicy.java' }
        from(new File(webSources, 'main/java')) {
            include 'local/ttlab/web/DelegatedHttpsConnection.java',
                    'local/ttlab/web/WebDestinations.java', 'local/ttlab/web/WebSite.java'
        }
        into workerJava
    }
    tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn stageWorkerJava }
}
if (project.hasProperty('webFixture')) {
    def syntheticFixture = tasks.register('stageSyntheticWebFixture', Sync) {
        from(rootProject.file(project.findProperty('webFixtureAssets') ?: '.qa/web-fixture')) {
            include 'fixture.png', 'fixture.mp4'
        }
        into fixtureAssets
    }
    tasks.matching { it.name == 'mergeDebugAssets' }.configureEach { dependsOn syntheticFixture }
}
dependencies {
    implementation files(project.hasProperty('isolatedEngineAar')
            ? rootProject.file(project.property('isolatedEngineAar')) : 'engine/dist/tgengine.aar')
    if (!isolatedWorker) {
        implementation 'net.zetetic:sqlcipher-android:4.19.1@aar'
        implementation 'androidx.sqlite:sqlite:2.2.0'
    }
    testImplementation 'junit:junit:4.13.2'
}
