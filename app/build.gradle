plugins { id 'com.android.application' }
apply from: rootProject.file('signing.gradle')
def isolatedClient = project.hasProperty('isolatedClient')
def galleryId = (project.findProperty('qaApplicationId') ?: 'local.ttlab.gallery').toString()
def isolatedHost = (project.findProperty('qaIsolatedHost') ?: 'org.im.ttalk.lab').toString()
def tgId = isolatedClient ? galleryId : (project.findProperty('qaTelegramApplicationId') ?: 'local.ttlab.telegram').toString()
def tgAuthority = isolatedClient ? galleryId+'.telegram.bridge' : (project.findProperty('qaTelegramAuthority') ?: tgId+'.bridge').toString()
android {
    namespace 'local.ttlab.gallery'
    compileSdk 36
    defaultConfig {
        applicationId galleryId
        manifestPlaceholders = [galleryLabel: project.hasProperty('qaApplicationId') ? 'Tato Lab · Verificación' : 'Tato Galería']
        manifestPlaceholders.fixtureAuthority = (project.findProperty('qaApplicationId') ?: 'local.ttlab.gallery').toString()+'.fixture.telegram'
        manifestPlaceholders.telegramPackage = tgId
        manifestPlaceholders.telegramAuthority = tgAuthority
        manifestPlaceholders.isolatedHost = isolatedHost
        minSdk 31
        targetSdk 36
        versionCode isolatedClient ? 33 : 30
        versionName isolatedClient ? '2.31' : '2.28'
        buildConfigField 'String','TELEGRAM_PACKAGE','"'+tgId+'"'
        buildConfigField 'String','TELEGRAM_AUTHORITY','"'+tgAuthority+'"'
        buildConfigField 'boolean','ISOLATED_CLIENT',isolatedClient.toString()
        buildConfigField 'String','ISOLATED_HOST','"'+isolatedHost+'"'
        ndk { abiFilters (project.findProperty('uiQaAbi') ?: 'arm64-v8a').toString() }
        testInstrumentationRunner 'local.ttlab.gallery.GalleryChecks'
        testApplicationId ((project.findProperty('qaApplicationId') ?: 'local.ttlab.gallery').toString()+'.test')
    }
    buildTypes { release { minifyEnabled false } }
    buildFeatures { buildConfig true; aidl isolatedClient }
    if (isolatedClient) {
        sourceSets {
            main.java.srcDirs 'src/isolated/java', rootProject.file('isolated/java'),
                    rootProject.file('telegram/src/main/java/local/ttlab/telegram'),
                    rootProject.file('webconnector/src/main/java')
            main.aidl.srcDir rootProject.file('isolated/aidl')
            debug.manifest.srcFile 'src/isolated/AndroidManifest.xml'
            release.manifest.srcFile 'src/isolated/AndroidManifest.xml'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    androidResources { noCompress += ['tflite','onnx','f32'] }
}
dependencies {
    implementation 'net.zetetic:sqlcipher-android:4.19.1@aar'
    implementation 'androidx.sqlite:sqlite:2.2.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.28.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    testImplementation 'junit:junit:4.13.2'
}
